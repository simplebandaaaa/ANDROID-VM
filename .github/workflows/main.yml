name: Ubuntu 24.04 RDP with Android (Redroid)

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Fix Package Conflicts & Update APT
        run: |
          sudo apt-get clean
          sudo apt-get update --fix-missing -qq
          sudo apt-get install -f -y

      - name: Install LXQt, XRDP & Utilities
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            lxqt-core lxqt-session openbox xrdp dbus-x11 adb scrcpy docker.io

      - name: Setup User & Permissions
        run: |
          sudo useradd -m -s /bin/bash rdpuser
          echo 'rdpuser:Ubuntu@12345' | sudo chpasswd
          sudo usermod -aG sudo,docker rdpuser

      - name: Configure LXQt Session
        run: |
          sudo -u rdpuser bash -c 'printf "%s\n" "startlxqt" > /home/rdpuser/.xsession'
          sudo chown rdpuser:rdpuser /home/rdpuser/.xsession
          sudo chmod 755 /home/rdpuser/.xsession

          sudo tee /etc/xrdp/startwm.sh > /dev/null <<'EOF'
          #!/bin/sh
          unset DBUS_SESSION_BUS_ADDRESS
          unset XDG_RUNTIME_DIR

          export LIBGL_ALWAYS_SOFTWARE=1
          export QT_QUICK_BACKEND=software
          export XDG_CONFIG_DIRS=/etc/xdg/xdg-LXQt:/etc/xdg:/etc
          export XDG_CURRENT_DESKTOP=LXQt
          export XDG_SESSION_DESKTOP=LXQt
          export DESKTOP_SESSION=LXQt

          exec dbus-run-session -- startlxqt
          EOF

          sudo chmod 755 /etc/xrdp/startwm.sh

      - name: Start Redroid (Android 11 Container)
        run: |
          sudo systemctl start docker
          sudo docker run -d --privileged \
            --name redroid \
            -p 5555:5555 \
            redroid/redroid:11.0.0-latest \
            androidboot.redroid_width=720 \
            androidboot.redroid_height=1280 \
            androidboot.redroid_dpi=320

      - name: Start XRDP Service
        run: |
          sudo service xrdp restart
          sleep 2

      - name: Connect Tailscale
        uses: tailscale/github-action@v2
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Show Connection Details
        run: |
          sleep 2
          echo "=========================================="
          echo "TAILSCALE IP:"
          tailscale ip -4
          echo "=========================================="
          echo "RDP USER: rdpuser"
          echo "RDP PASSWORD: Ubuntu@12345"
          echo "=========================================="

      - name: Keep Alive
        run: |
          sleep 5.5h

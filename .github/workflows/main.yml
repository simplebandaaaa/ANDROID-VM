name: Tailscale Ubuntu RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Desktop Environment & XRDP
      run: |
        sudo apt update
        sudo apt install -y xfce4 xfce4-goodies xrdp
        sudo adduser xrdp ssl-cert

    - name: Create Custom RDP User & Set Password
      run: |
        sudo useradd -m -s /bin/bash rdpuser
        echo 'rdpuser:Password123' | sudo chpasswd
        sudo usermod -aG sudo rdpuser
        echo "xfce4-session" | sudo tee /home/rdpuser/.xsession
        sudo chown rdpuser:rdpuser /home/rdpuser/.xsession
        sudo service xrdp restart

    - name: Connect to Tailscale
      uses: tailscale/github-action@v2
      with:
        authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

    - name: Display Tailscale IP Address
      run: |
        echo "=========================================="
        echo "Tailscale IP:"
        tailscale ip -4
        echo "=========================================="

    - name: Keep RDP Alive
      run: |
        sleep 6h

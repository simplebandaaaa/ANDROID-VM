name: Tailscale Ubuntu RDP (100% Fixed)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install LXDE, VNC & XRDP
      run: |
        sudo apt update
        sudo apt install -y lxde tightvncserver xrdp dbus-x11

    - name: Setup User & Session Config
      run: |
        sudo useradd -m -s /bin/bash rdpuser
        echo 'rdpuser:Password123' | sudo chpasswd
        sudo usermod -aG sudo rdpuser

        # Create session startup script
        sudo bash -c 'cat << "EOF" > /home/rdpuser/.xsession
        #!/bin/sh
        export XDG_DATA_DIRS=/usr/share/lxde:/usr/share/gdm:/usr/local/share:/usr/share
        exec startlxde
        EOF'

        sudo chown rdpuser:rdpuser /home/rdpuser/.xsession
        sudo chmod +x /home/rdpuser/.xsession

        # Force XRDP startwm to use LXDE
        sudo bash -c 'cat << "EOF" > /etc/xrdp/startwm.sh
        #!/bin/sh
        if [ -r /etc/default/locale ]; then
            . /etc/default/locale
            export LANG LANGUAGE
        fi
        export XDG_SESSION_TYPE=x11
        export XDG_CURRENT_DESKTOP=LXDE
        exec startlxde
        EOF'

        sudo chmod +x /etc/xrdp/startwm.sh
        sudo service xrdp restart

    - name: Connect to Tailscale
      uses: tailscale/github-action@v2
      env:
        TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      with:
        authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

    - name: Display Tailscale IP Address
      run: |
        echo "=========================================="
        echo "Tailscale IP:"
        tailscale ip -4
        echo "=========================================="

    - name: Keep RDP Alive
      run: |
        sleep 6h

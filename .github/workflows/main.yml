name: Tailscale Ubuntu RDP (Black Screen Fix)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install XFCE Desktop & XRDP
      run: |
        sudo apt update
        sudo apt install -y xfce4 xfce4-goodies xrdp dbus-x11 x11-xserver-utils
        sudo adduser xrdp ssl-cert

    - name: Setup User & Fix Black Screen Session Variables
      run: |
        sudo useradd -m -s /bin/bash rdpuser
        echo 'rdpuser:Password123' | sudo chpasswd
        sudo usermod -aG sudo rdpuser

        # User specific xsession setup
        sudo -u rdpuser bash -c 'echo "exec startxfce4" > /home/rdpuser/.xsession'
        sudo chmod +x /home/rdpuser/.xsession

        # Fix startwm.sh to load DBus properly (Solves Black Screen Issue)
        sudo bash -c 'cat <<EOF > /etc/xrdp/startwm.sh
        #!/bin/sh
        if [ -r /etc/default/locale ]; then
            . /etc/default/locale
            export LANG LANGUAGE
        fi
        export XDG_SESSION_TYPE=x11
        export XDG_CURRENT_DESKTOP=XFCE
        export XDG_CONFIG_DIRS=/etc/xdg
        exec dbus-launch --exit-with-session startxfce4
        EOF'

        sudo chmod +x /etc/xrdp/startwm.sh
        sudo service xrdp restart

    - name: Connect to Tailscale
      uses: tailscale/github-action@v2
      env:
        TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      with:
        authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

    - name: Display Tailscale IP Address
      run: |
        echo "=========================================="
        echo "Tailscale IP:"
        tailscale ip -4
        echo "=========================================="

    - name: Keep RDP Alive
      run: |
        sleep 6h

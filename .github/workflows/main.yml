name: Ubuntu 24.04 LXQt RDP (Ultra Fast)

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Install LXQt & Speed Dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            openbox lxqt-session lxqt-qtplugin xrdp dbus-x11 libgl1-mesa-dri

      - name: Create RDP user
        run: |
          sudo useradd -m -s /bin/bash rdpuser
          echo 'rdpuser:Ubuntu@12345' | sudo chpasswd
          sudo usermod -aG sudo rdpuser

      - name: Optimize XRDP Settings for High Speed & Low Latency
        run: |
          # Color depth 16-bit for fast streaming & zero lag
          sudo sed -i 's/max_bpp=32/max_bpp=16/g' /etc/xrdp/xrdp.ini
          sudo sed -i 's/xserverbpp=24/xserverbpp=16/g' /etc/xrdp/xrdp.ini
          sudo sed -i 's/crypt_level=high/crypt_level=low/g' /etc/xrdp/xrdp.ini
          
          # Enable RFX compression for instant response
          sudo sed -i 's/#rfx=true/rfx=true/g' /etc/xrdp/xrdp.ini

      - name: Configure Fast LXQt Session
        run: |
          sudo -u rdpuser bash -c 'printf "%s\n" "startlxqt" > /home/rdpuser/.xsession'
          sudo chown rdpuser:rdpuser /home/rdpuser/.xsession
          sudo chmod 755 /home/rdpuser/.xsession

          sudo tee /etc/xrdp/startwm.sh > /dev/null <<'EOF'
          #!/bin/sh
          unset DBUS_SESSION_BUS_ADDRESS
          unset XDG_RUNTIME_DIR

          # Speed & Rendering Optimizations
          export LIBGL_ALWAYS_SOFTWARE=1
          export QT_QUICK_BACKEND=software
          export XDG_CONFIG_DIRS=/etc/xdg/xdg-LXQt:/etc/xdg:/etc
          export XDG_CURRENT_DESKTOP=LXQt
          export XDG_SESSION_DESKTOP=LXQt
          export DESKTOP_SESSION=LXQt

          exec dbus-run-session -- startlxqt
          EOF

          sudo chmod 755 /etc/xrdp/startwm.sh

      - name: Start XRDP Service
        run: |
          sudo service xrdp restart
          sleep 2

      - name: Connect Tailscale
        uses: tailscale/github-action@v2
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Show connection details
        run: |
          sleep 2
          echo "=========================================="
          echo "TAILSCALE IP:"
          tailscale ip -4
          echo "=========================================="
          echo "RDP USER: rdpuser"
          echo "RDP PASSWORD: Ubuntu@12345"
          echo "=========================================="

      - name: Keep alive
        run: |
          sleep 5.5h

name: Tailscale Ubuntu RDP (100% Fixed)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install XFCE & Clear Old Configs
      run: |
        sudo apt update
        sudo apt install -y xfce4 xfce4-goodies xrdp dbus-x11 x11-xserver-utils
        
        # Purane session conflicts remove karein
        sudo apt remove -y gnome-session gnome-terminal || true

    - name: Configure XRDP & Environment Variables
      run: |
        # Custom User setup
        sudo useradd -m -s /bin/bash rdpuser
        echo 'rdpuser:Password123' | sudo chpasswd
        sudo usermod -aG sudo rdpuser

        # User ki .xsession file configure karein
        sudo bash -c 'echo "dbus-launch --exit-with-session xfce4-session" > /home/rdpuser/.xsession'
        sudo chown rdpuser:rdpuser /home/rdpuser/.xsession
        sudo chmod +x /home/rdpuser/.xsession

        # Global XRDP startup script ko complete overwrite karein (Failsafe bypass)
        sudo bash -c 'cat << "EOF" > /etc/xrdp/startwm.sh
        #!/bin/sh
        unset DBUS_SESSION_BUS_ADDRESS
        unset XDG_RUNTIME_DIR
        export XDG_SESSION_TYPE=x11
        export XDG_CURRENT_DESKTOP=XFCE
        export XDG_CONFIG_DIRS=/etc/xdg
        exec dbus-launch --exit-with-session xfce4-session
        EOF'

        sudo chmod +x /etc/xrdp/startwm.sh
        sudo adduser xrdp ssl-cert
        sudo service xrdp restart

    - name: Connect to Tailscale
      uses: tailscale/github-action@v2
      env:
        TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      with:
        authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

    - name: Display Tailscale IP Address
      run: |
        echo "=========================================="
        echo "Tailscale IP:"
        tailscale ip -4
        echo "=========================================="

    - name: Keep RDP Alive
      run: |
        sleep 6h

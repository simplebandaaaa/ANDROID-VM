name: Tailscale Ubuntu RDP (Lag Free)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Fast Desktop & XRDP
      run: |
        sudo apt update
        sudo apt install -y mate-desktop-environment mate-indicator-applet xrdp dbus-x11 xorgxrdp
        sudo adduser xrdp ssl-cert

    - name: Optimize XRDP Settings for High Speed & Low Latency
      run: |
        # Color depth 16-bit for low bandwidth & zero lag
        sudo sed -i 's/max_bpp=32/max_bpp=16/g' /etc/xrdp/xrdp.ini
        sudo sed -i 's/xserverbpp=24/xserverbpp=16/g' /etc/xrdp/xrdp.ini
        
        # Maximize CPU compression threads
        sudo sed -i 's/#ls_top_window_enable=true/ls_top_window_enable=false/g' /etc/xrdp/xrdp.ini
        sudo sed -i 's/crypt_level=high/crypt_level=low/g' /etc/xrdp/xrdp.ini

    - name: Setup User & Session Config
      run: |
        sudo useradd -m -s /bin/bash rdpuser
        echo 'rdpuser:Password123' | sudo chpasswd
        sudo usermod -aG sudo rdpuser
        
        # Set MATE as default desktop
        echo "mate-session" | sudo tee /home/rdpuser/.xsession
        sudo chown rdpuser:rdpuser /home/rdpuser/.xsession
        
        # Overwrite startwm.sh for high performance
        sudo bash -c 'cat <<EOF > /etc/xrdp/startwm.sh
        #!/bin/sh
        export MATE_XAUTHORITY_GUEST=1
        exec mate-session
        EOF'
        
        sudo chmod +x /etc/xrdp/startwm.sh
        sudo service xrdp restart

    - name: Connect to Tailscale
      uses: tailscale/github-action@v2
      env:
        TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      with:
        authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

    - name: Display Tailscale IP Address
      run: |
        echo "=========================================="
        echo "Tailscale IP:"
        tailscale ip -4
        echo "=========================================="

    - name: Keep RDP Alive
      run: |
        sleep 6h
